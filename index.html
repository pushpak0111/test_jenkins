<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Time & Date Script Test</title>
    <style>
        body { font-family: monospace; background: #f4f4f9; padding: 30px; }
        .clock-box { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    </style>
</head>
<body>
    <div class="clock-box">
        <h1>System Clock Test</h1>
        <div id="timestamp">Loading current time...</div>
    </div>

    <script>
        function updateTime() {
            const now = new Date();
            document.getElementById('timestamp').innerHTML = `
                <p><strong>Local Time:</strong> ${now.toString()}</p>
                <p><strong>UTC Time:</strong> ${now.toGMTString()}</p>
                <h2>${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}:${now.getSeconds().toString().padStart(2, '0')}</h2>
            `;
        }
        // Run immediately and update every second
        updateTime();
        setInterval(updateTime, 1000);
    </script>
</body>
</html>
